<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="850" viewBox="0 0 1280 850" role="img"><title>Arquitetura da distribuidora: site e quatro aplicativos conectados</title><defs><linearGradient id="panelGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1C3642"/><stop offset="1" stop-color="#11232F"/></linearGradient><linearGradient id="activeGlow"><stop stop-color="#67D7E8"/><stop offset="1" stop-color="#A9B4FA"/></linearGradient></defs><rect x="0" y="0" width="1280" height="850" rx="18" fill="#09131C"/><text x="40" y="57" font-family="DejaVu Sans,Arial,sans-serif" font-size="29" font-weight="500" fill="#EDF5F7" text-anchor="start">Um site. Quatro aplicativos. A mesma operação.</text><text x="42" y="88" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="400" fill="#A3BAC8" text-anchor="start">Autorização e dados compartilhados no servidor</text><rect x="440" y="130" width="400" height="88" rx="15" fill="url(#panelGlow)" stroke="#2A4354"/><text x="640.0" y="165" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" fill="#EDF5F7" text-anchor="middle">Site completo do patrão</text><text x="640.0" y="194" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#A3BAC8" text-anchor="middle">Web com abas e relatórios</text><rect x="40" y="275" width="280" height="96" rx="15" fill="url(#panelGlow)" stroke="#2A4354"/><text x="180.0" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" fill="#EDF5F7" text-anchor="middle">App Patrão</text><text x="180.0" y="339" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#A3BAC8" text-anchor="middle">Central dos três setores</text><rect x="345" y="275" width="280" height="96" rx="15" fill="url(#panelGlow)" stroke="#2A4354"/><text x="485.0" y="310" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" fill="#EDF5F7" text-anchor="middle">App Retirada</text><text x="485.0" y=
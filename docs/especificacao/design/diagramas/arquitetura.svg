,sans-serif" font-size="18" font-weight="500" fill="#EDF5F7" text-anchor="middle">Documentos privados</text><text x="640.0" y="744" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#A3BAC8" text-anchor="middle">Anexos e versões autorizadas</text><rect x="880" y="680" width="360" height="100" rx="15" fill="url(#panelGlow)" stroke="#2A4354"/><text x="1060.0" y="715" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" fill="#EDF5F7" text-anchor="middle">Jobs e integrações</text><text x="1060.0" y="744" font-family="DejaVu Sans,Arial,sans-serif" font-size="13" font-weight="400" fill="#A3BAC8" text-anchor="middle">Fiscal, pagamentos e IA</text><path d="M640 218L640 245" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M180 245L1095 245" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M180 245L180 275" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M180 371L180 430" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M485 245L485 275" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M485 371L485 430" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M790 245L790 275" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M790 371L790 430" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M1095 245L1095 275" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M1095 371L1095 430" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M180 430L1095 430" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M640 430L640 475" fill="none" stroke="#67D7E8" stroke-width="2"/><path d="M640 575L640 625" fill="none" stroke="#B3F18A" stroke-width="2"/><path d="M220 625L1060 625" fill="none" stroke="#B3F18A" stroke-width="2"/><path d="M220 625L220 680" fill="none" stroke="#B3F18A" stroke-width="2"/><path d="M640 625L640 680" fill="none" stroke="#B3F18A" stroke-width="2"/><path d="M1060 625L1060 680" fill="none" stroke="#B3F18A" stroke-width="2"/></svg>

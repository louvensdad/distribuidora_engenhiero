spring:
  application:
    name: engenheiro-api
  datasource:
    url: ${ENGENHEIRO_DB_URL:jdbc:postgresql://localhost:5433/engenheiro}
    username: ${ENGENHEIRO_DB_USER:engenheiro}
    password: ${ENGENHEIRO_DB_PASSWORD:}
    # F16: banco indisponível = resposta rápida (503) em vez de segurar a requisição 30 s esperando conexão.
    hikari:
      connection-timeout: 3000
      validation-timeout: 2000
      maximum-pool-size: ${ENGENHEIRO_DB_POOL:20}
  flyway:
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true
  # F16: sessão do site no banco; tabelas criadas pelo Flyway (V15), nunca pelo Spring.
  session:
    timeout: 30m
    jdbc:
      initialize-schema: never
      cleanup-cron: "0 * * * * *"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

server:
  port: ${PORT:8080}
  tomcat:
    max-swallow-size: 12MB  # lê o excesso até este teto para responder 422 em vez de cortar a conexão
  servlet:
    session:
      timeout: 30m
      cookie:
        name: ENGENHEIRO_SESSION
        http-only: true
        secure: ${ENGENHEIRO_COOKIE_SECURE:true}
        same-site: lax
  error:
    include-message: never
    include-stacktrace: never

engenheiro:
  # Criação de contas no provedor de identidade (ADR-027). Sem estes valores: NÃO CONFIGURADO.
  provisioner:
    client-id: ${ENGENHEIRO_PROVISIONER_CLIENT_ID:}
    client-secret: ${ENGENHEIRO_PROVISIONER_CLIENT_SECRET:}
    # F17: em servidor, token e administração do IdP pela rede interna (a borda pública bloqueia /admin).
    internal-url: ${ENGENHEIRO_PROVISIONER_INTERNAL_URL:}
  storage:
    # Sem valor = anexos NÃO CONFIGURADOS (503). Produção: armazenamento privado S3-compatível (F16).
    local-dir: ${ENGENHEIRO_STORAGE_DIR:}
  # F15 (ADR-029): IA da gestão. Sem ANTHROPIC_API_KEY = NÃO CONFIGURADA (nada é enviado, nada é simulado).
  # Orçamento padrão ZERO: a IA recusa perguntas até o responsável definir ENGENHEIRO_IA_ORCAMENTO_USD.
  ia:
    provedor: ${ENGENHEIRO_IA_PROVEDOR:anthropic}
    modelo: ${ENGENHEIRO_IA_MODELO:claude-opus-5-5}
    esforco: ${ENGENHEIRO_IA_ESFORCO:medium}
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
    # ADR-032: DeepSeek (ENGENHEIRO_IA_PROVEDOR=deepseek). Preços abaixo devem acompanhar o modelo escolhido.
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      modelo: ${ENGENHEIRO_IA_DEEPSEEK_MODELO:deepseek-flash}
      base-url: ${ENGENHEIRO_IA_DEEPSEEK_URL:https://api.deepseek.com}
    orcamento-mensal-usd: ${ENGENHEIRO_IA_ORCAMENTO_USD:0}
    reserva-por-pergunta-usd: ${ENGENHEIRO_IA_RESERVA_USD:0.50}
    limite-diario-por-usuario: ${ENGENHEIRO_IA_LIMITE_DIARIO:30}
    max-etapas: 6
    # Preço do modelo configurado (US$ por milhão de tokens); trocar junto com o modelo.
    preco:
      entrada-por-milhao-usd: ${ENGENHEIRO_IA_PRECO_ENTRADA:4.00}
      saida-por-milhao-usd: ${ENGENHEIRO_IA_PRECO_SAIDA:20.00}
      cache-leitura-por-milhao-usd: ${ENGENHEIRO_IA_PRECO_CACHE:0.20}
  # F16 (D06): primeiro acesso de banco VAZIO — id da conta do dono no IdP. Sem efeito se já houver empresa.
  # Retirar depois da primeira subida (runbook de implantação).
  bootstrap:
    owner-subject: ${ENGENHEIRO_BOOTSTRAP_OWNER_SUBJECT:}
    owner-name: ${ENGENHEIRO_BOOTSTRAP_OWNER_NAME:Responsável}
    branch-name: ${ENGENHEIRO_BOOTSTRAP_BRANCH:Matriz}
  # F16: segredo do servidor para pseudonimizar o ator nos logs (HMAC). Obrigatório em prod/homologação.
  log:
    pepper: ${ENGENHEIRO_LOG_PEPPER:}
  empresa:
    nome: Distribuidora de Cana Engenheiro Ltda
  security:
    oidc:
      issuer: ${ENGENHEIRO_OIDC_ISSUER:http://localhost:8180/realms/engenheiro}
      jwk-set-uri: ${ENGENHEIRO_OIDC_JWKS:http://localhost:8180/realms/engenheiro/protocol/openid-connect/certs}
      audience: engenheiro-api
  # Login do site do patrão (BFF). Sem client-secret o login web fica NÃO CONFIGURADO (API bearer segue ativa).
  web:
    client-id: engenheiro-web
    client-secret: ${ENGENHEIRO_WEB_CLIENT_SECRET:}
    app-url: ${ENGENHEIRO_WEB_APP_URL:http://localhost:4200/}
    authorization-uri: ${engenheiro.security.oidc.issuer}/protocol/openid-connect/auth
    token-uri: ${ENGENHEIRO_OIDC_TOKEN_URI:${engenheiro.security.oidc.issuer}/protocol/openid-connect/token}
    end-session-uri: ${engenheiro.security.oidc.issuer}/protocol/openid-connect/logout

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      # F16: sem banco a instância sai de rota (readiness DOWN) mas não é reiniciada (liveness não depende do banco).
      group:
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState
      show-details: never
  info:
    env:
      enabled: true

info:
  app:
    nome: Engenheiro API
    # Identificação do artefato em execução (F16): commit e versão vêm do build/implantação.
    commit: ${ENGENHEIRO_COMMIT:desconhecido}
    versao: ${ENGENHEIRO_VERSAO:0.1.0-SNAPSHOT}
    empresa: Distribuidora de Cana Engenheiro Ltda

# Perfil de desenvolvimento: dados FICTÍCIOS. Nunca ativar em produção.
spring:
  datasource:
    password: ${ENGENHEIRO_DB_PASSWORD:engenheiro-local}
  flyway:
    locations: classpath:db/migration,classpath:db/seed-local
server:
  servlet:
    session:
      cookie:
        secure: false  # http://localhost apenas
engenheiro:
  storage:
    local-dir: ${ENGENHEIRO_STORAGE_DIR:${user.home}/.local/share/engenheiro/objetos}
  seed-local:
    enabled: true

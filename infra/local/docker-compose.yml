# Ambiente LOCAL de desenvolvimento. Não usar em produção.
name: engenheiro-local
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: engenheiro
      POSTGRES_USER: engenheiro
      POSTGRES_PASSWORD: ${ENGENHEIRO_DB_PASSWORD:-engenheiro-local}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U engenheiro -d engenheiro"]
      interval: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm", "--http-port=8180"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin-local}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?defina KC_ADMIN_PASSWORD no ambiente}
      KC_HOSTNAME: http://localhost:8180
    ports:
      - "127.0.0.1:8180:8180"
    volumes:
      - ./keycloak/engenheiro-realm.json:/opt/keycloak/data/import/engenheiro-realm.json:ro

volumes:
  pgdata:

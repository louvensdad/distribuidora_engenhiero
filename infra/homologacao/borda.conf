# Borda TLS da homologação (F16): termina HTTPS e separa os dois nomes. Produção usa o mesmo desenho com certificado
# público (ACME) do domínio da empresa. HSTS só aqui (onde há TLS).
server_tokens off;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:5m;
log_format borda '$remote_addr [$time_iso8601] "$request_method $host$uri" $status ${request_time}s req=$request_id';

resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_request_id $req_id { default $http_x_request_id; "" $request_id; }

server {
    listen 8443 ssl;
    access_log /dev/stdout borda;   # sem query string
    http2 on;
    server_name gestao.homolog.localtest.me;
    ssl_certificate /tls/borda.crt;
    ssl_certificate_key /tls/borda.key;
    add_header Strict-Transport-Security "max-age=31536000" always;
    client_max_body_size 11m;
    location / {
        set $site http://site:8080;
        proxy_pass $site;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $req_id;
        proxy_read_timeout 200s;
    }
}

server {
    listen 8443 ssl;
    access_log /dev/stdout borda;   # sem query string
    http2 on;
    server_name login.homolog.localtest.me;
    ssl_certificate /tls/borda.crt;
    ssl_certificate_key /tls/borda.key;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        set $kc http://keycloak:8080;
        proxy_pass $kc;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffer_size 64k;
        proxy_buffers 8 64k;
    }
}

# Qualquer outro nome: recusa (sem servir nada por engano).
server {
    listen 8443 ssl default_server;
    access_log off;
    server_name _;
    ssl_certificate /tls/borda.crt;
    ssl_certificate_key /tls/borda.key;
    return 421;
}

# HOMOLOGAÇÃO local (F16, ADR-030): mesma forma da produção — TLS na borda, nomes próprios, Keycloak em modo de
# produção com banco, API com perfil "homologacao" (guarda de produção ativa) e site em nginx sem privilégio.
# Segredos em ~/.config/engenheiro/homologacao/.env (gerados por preparar.sh). Uso: infra/homologacao/subir.sh
name: engenheiro-homolog
services:
  postgres:
    restart: unless-stopped
    image: postgres:18.6-alpine
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?rode preparar.sh}
      ENGENHEIRO_DB_PASSWORD: ${ENGENHEIRO_DB_PASSWORD:?}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 30
    networks: [interna]

  keycloak:
    restart: unless-stopped
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start", "--import-realm", "--http-enabled=true", "--http-port=8080", "--proxy-headers=xforwarded",
              "--hostname=https://login.${HOMOLOG_DOMINIO}:${HOMOLOG_PORTA}", "--health-enabled=true"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KC_DB_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin-homolog
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?}
    volumes:
      - ${HOMOLOG_DIR}/engenheiro-realm.json:/opt/keycloak/data/import/engenheiro-realm.json:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [interna]

  api:
    restart: unless-stopped
    image: engenheiro-api:${ENGENHEIRO_COMMIT:?}
    environment:
      SPRING_PROFILES_ACTIVE: ${API_PERFIS:-homologacao}   # implantar.sh --simular-falha usa um perfil proibido
      ENGENHEIRO_DB_URL: jdbc:postgresql://postgres:5432/engenheiro
      ENGENHEIRO_DB_USER: engenheiro
      ENGENHEIRO_DB_PASSWORD: ${ENGENHEIRO_DB_PASSWORD:?}
      ENGENHEIRO_OIDC_ISSUER: https://login.${HOMOLOG_DOMINIO}:${HOMOLOG_PORTA}/realms/engenheiro
      ENGENHEIRO_OIDC_JWKS: https://login.${HOMOLOG_DOMINIO}:${HOMOLOG_PORTA}/realms/engenheiro/protocol/openid-connect/certs
      ENGENHEIRO_WEB_APP_URL: https://gestao.${HOMOLOG_DOMINIO}:${HOMOLOG_PORTA}/
      ENGENHEIRO_WEB_CLIENT_SECRET: ${ENGENHEIRO_WEB_CLIENT_SECRET:?}
      ENGENHEIRO_LOG_PEPPER: ${ENGENHEIRO_LOG_PEPPER:?}
      ENGENHEIRO_BOOTSTRAP_OWNER_SUBJECT: ${ENGENHEIRO_BOOTSTRAP_OWNER_SUBJECT:-}
      ENGENHEIRO_BOOTSTRAP_OWNER_NAME: Patrão (homologação)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENGENHEIRO_IA_ORCAMENTO_USD: ${ENGENHEIRO_IA_ORCAMENTO_USD:-0}
      JAVA_TOOL_OPTIONS: >-
        -XX:MaxRAMPercentage=75 -XX:+ExitOnOutOfMemoryError -Duser.timezone=UTC -Dfile.encoding=UTF-8
        -Djavax.net.ssl.trustStore=/tls/truststore.p12 -Djavax.net.ssl.trustStoreType=PKCS12
        -Djavax.net.ssl.trustStorePassword=homolog-truststore
    volumes:
      - objetos:/dados/objetos
      - ${HOMOLOG_DIR}/tls/truststore.p12:/tls/truststore.p12:ro
    depends_on:
      postgres: {condition: service_healthy}
    networks: [interna]

  site:
    restart: unless-stopped
    image: engenheiro-site:${ENGENHEIRO_COMMIT:?}
    depends_on:
      api: {condition: service_healthy}
    networks: [interna]

  borda:
    restart: unless-stopped
    image: nginxinc/nginx-unprivileged:1.31.7-alpine@sha256:b5047b9b76845eac124358373c6852377c52e4b05834a47647e955dd91cb8f1e
    volumes:
      - ./borda.conf:/etc/nginx/conf.d/default.conf:ro
      - ${HOMOLOG_DIR}/tls/borda.crt:/tls/borda.crt:ro
      - ${HOMOLOG_DIR}/tls/borda.key:/tls/borda.key:ro
    ports:
      - "127.0.0.1:8443:8443"
      - "[::1]:8443:8443"
    depends_on: [site, keycloak]
    networks:
      interna:
        # Dentro da rede, os nomes públicos também chegam à borda (a API valida o emissor pela mesma URL do navegador).
        aliases: ["gestao.${HOMOLOG_DOMINIO}", "login.${HOMOLOG_DOMINIO}"]

volumes:
  pgdata:
  objetos:

networks:
  interna:
